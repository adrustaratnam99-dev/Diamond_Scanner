<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090a09">
    <meta name="description" content="Load local videos and switch between them instantly with the number keys.">
    <meta property="og:title" content="Cutboard - Instant Video Switcher">
    <meta property="og:description" content="Load local videos and switch between them instantly with the number keys.">
    <meta property="og:image" content="og.png">
    <title>Cutboard - Instant Video Switcher</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=20261014-1">
    <link rel="stylesheet" href="camera.css?v=20261014-2">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Cutboard">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>CUTBOARD</span>
        </div>
        <div class="status-pill"><span class="status-dot"></span> LOCAL ONLY</div>
        <div class="top-actions">
          <button class="keypad-button" id="keypadButton" aria-pressed="false"><span aria-hidden="true">#</span> Keyboard</button>
          <button class="camera-button" id="cameraButton"><span aria-hidden="true"></span><b id="cameraButtonText">Enable camera</b></button>
          <button class="blackout-button" id="blackoutButton" aria-label="Show current screen in full screen"><span aria-hidden="true"></span> Full screen</button>
          <button class="add-button" id="addButton"><b aria-hidden="true">+</b> Add videos</button>
        </div>
        <input id="fileInput" class="file-input" type="file" accept="video/*" multiple>
      </header>

      <section id="stage" class="stage logo-mode" aria-label="Video stage">
        <dialog id="reportDialog" aria-label="Report preview"><button id="closeReport" aria-label="Close report">Close report</button><iframe id="reportEmbed" title="Printable analysis report"></iframe></dialog>
        <video id="cameraPlayer" class="camera-player" autoplay muted playsinline aria-label="Live device camera"></video>
        <div id="analysisHeader" class="analysis-header" hidden>
          <div class="analysis-logo-panel">
            <img src="drc-logo-clean.png" alt="DRC DS Gem and Diamond Analyzer 6">
          </div>
          <div id="snapshotFrame" class="snapshot-frame">
            <canvas id="cameraSnapshot" class="camera-snapshot" aria-label="Last camera frame"></canvas>
          </div>
        </div>
        <div id="players" class="players"></div>
        <div id="processingStatus" class="processing-status" hidden><span>Processing</span><strong id="processingTime">30 sec</strong><progress id="processingProgress" max="30" value="0" aria-label="Processing progress"></progress></div>
        <div id="resultFrame" class="analysis-result" hidden>
          <div class="result-actions"><button id="resultHome" class="report-preview-button">Home</button><button id="previewReport" class="report-preview-button">Preview / Print Report</button></div>
          <div class="report-body">
            <ol class="report-findings"><li>Natural</li><li>Revitalized</li><li>Highly Purified</li><li>Safe</li></ol>
            <div class="report-graph"><span>Excellent</span><div class="report-bar" role="img" aria-label="Excellent: full green bar"></div></div>
          </div>
          <fieldset class="report-verdict"><legend>Final Result</legend><h2>Man made Diamond</h2></fieldset>
        </div>
        <div id="emptyStage" class="empty-stage">
          <img class="standby-logo" src="drc-logo-clean.png" alt="DRC DS Gem and Diamond Analyzer 6">
          <div class="empty-icon" aria-hidden="true"><span>+</span></div>
          <h1 id="emptyTitle">Load your first set</h1>
          <p id="emptyCopy">Select up to eight videos from this device.</p>
          <button id="emptyAddButton" class="primary-button">Choose videos</button>
        </div>
        <button id="stageKeypadButton" class="keypad-button stage-keypad-button active" aria-label="Toggle keyboard" title="Toggle keyboard" aria-pressed="true"><span aria-hidden="true">#</span></button>
        <div id="controlPad" class="control-pad" aria-label="On-screen keyboard">
          <button data-key="0">0</button>
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button>
          <button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button>
          <button data-key="9">9</button>
          <button data-key="Backspace" aria-label="Backspace">&#9003;</button><button data-key="Escape">CLEAR</button><button data-key="Enter">START</button><button data-key="c">CAMERA</button><button data-key="l">LOGO</button>
        </div>
      </section>

      <details class="library"><summary>Categories</summary><section aria-label="Video slots">
        <div class="library-heading">
          <div><span>CATEGORIES</span><strong id="videoCount">0 / 40</strong></div>
          <div class="keyboard-hint"><kbd>L</kbd> LOGO <kbd>CODE + ENTER</kbd> PLAY <kbd>C</kbd> CAMERA</div>
        </div>
        <div id="slots" class="slots"></div>
      </section></details>
      <button id="notice" class="notice" hidden aria-label="Dismiss message"><span id="noticeText"></span><b>×</b></button>
    </main>
    <script src="app.js?v=20261014-5"></script>
  </body>
</html>
