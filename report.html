<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DRC DS - Report Preview</title><link rel="stylesheet" href="report.css?v=20261014-1"></head>
<body>
  <nav class="actions"><button id="reportHome">Home</button><strong>REPORT PREVIEW</strong><div class="export-actions"><button id="downloadPdf">Download PDF</button><button id="print">Print</button></div></nav>
  <p id="error" hidden>No report is available. Complete an analysis and open its report preview.</p>
  <article id="sheet" class="sheet">
    <header><img src="drc-report-logo.png" alt="DRC DS"><dl><dt>DATE</dt><dd id="date"></dd><dt>TIME</dt><dd id="time"></dd></dl></header>
    <h1>ANALYSIS REPORT</h1>
    <section class="details"><div><h2>ANALYSIS DETAILS</h2><ol id="findings"></ol></div><aside><h2 id="grade"></h2><span class="caption">GRADE / STATUS</span><div class="bars" id="bars"></div><figure><img id="photo" alt="Captured sample"><figcaption id="photoCaption">SAMPLE PHOTO</figcaption></figure></aside></section>
    <fieldset><legend>FINAL RESULT</legend><h2 id="result"></h2></fieldset>
    <footer><div>AUTHORIZED SIGNATORY<span class="signature"></span></div></footer>
  </article>
  <script src="jspdf.umd.min.js"></script><script src="report.js?v=20261014-1"></script>
</body></html>
